<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#fdf4ff" />
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#86198f" />
  <circle cx="40" cy="30" r="14" fill="#f472b6" />
  <text x="40" y="35" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">U</text>
  <text x="65" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">UMKM Super App — E-Commerce Module</text>
  <text x="390" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f5d0fe">| Berani Digital ID Local Merchant Ecosystem</text>

  <!-- Mobile Screen Mockups inside UI -->
  <g transform="translate(60, 85)">
    <!-- Phone 1: Storefront Catalog -->
    <rect x="0" y="0" width="220" height="380" rx="20" fill="#ffffff" stroke="#701a75" stroke-width="4" />
    <rect x="65" y="6" width="90" height="10" rx="5" fill="#f5d0fe" />
    <rect x="15" y="30" width="190" height="30" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1" />
    <text x="30" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a21caf">🔍 Cari produk UMKM...</text>

    <!-- Product Grid Item 1 -->
    <rect x="15" y="70" width="90" height="110" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1" />
    <rect x="25" y="80" width="70" height="50" rx="4" fill="#e879f9" opacity="0.3" />
    <text x="25" y="145" font-size="9" font-weight="bold" fill="#701a75">Keripik Tempe</text>
    <text x="25" y="160" font-size="10" font-weight="bold" fill="#a21caf">Rp 15.000</text>

    <!-- Product Grid Item 2 -->
    <rect x="115" y="70" width="90" height="110" rx="8" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1" />
    <rect x="125" y="80" width="70" height="50" rx="4" fill="#c084fc" opacity="0.3" />
    <text x="125" y="145" font-size="9" font-weight="bold" fill="#701a75">Kopi Robusta</text>
    <text x="125" y="160" font-size="10" font-weight="bold" fill="#a21caf">Rp 45.000</text>

    <!-- Banner -->
    <rect x="15" y="195" width="190" height="70" rx="8" fill="#86198f" />
    <text x="25" y="225" font-size="12" font-weight="bold" fill="#ffffff">Diskon Ongkir UMKM</text>
    <text x="25" y="242" font-size="9" fill="#f5d0fe">Kupon spesial pedagang lokal</text>
    <rect x="25" y="275" width="170" height="40" rx="8" fill="#fae8ff" />
    <text x="35" y="300" font-size="10" font-weight="bold" fill="#86198f">🛒 3 Produk di Keranjang</text>
  </g>

  <!-- Phone 2: Seamless Payment Checkout Flow -->
  <g transform="translate(340, 85)">
    <rect x="0" y="0" width="220" height="380" rx="20" fill="#ffffff" stroke="#701a75" stroke-width="4" />
    <rect x="65" y="6" width="90" height="10" rx="5" fill="#f5d0fe" />
    
    <text x="20" y="45" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#701a75">Pembayaran</text>
    <rect x="15" y="60" width="190" height="110" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" />
    <text x="25" y="85" font-size="10" fill="#6b21a8">Total Pembayaran</text>
    <text x="25" y="110" font-size="16" font-weight="bold" fill="#581c87">Rp 75.000</text>
    <text x="25" y="130" font-size="9" fill="#9333ea">Order ID: #UMKM-88219</text>
    <text x="25" y="150" font-size="9" fill="#16a34a">✓ Bebas biaya transaksi</text>

    <!-- QRIS Barcode Box -->
    <rect x="35" y="185" width="150" height="120" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
    <!-- QR Code patterns -->
    <rect x="55" y="200" width="24" height="24" fill="#581c87" /><rect x="58" y="203" width="18" height="18" fill="#ffffff" /><rect x="62" y="207" width="10" height="10" fill="#581c87" />
    <rect x="140" y="200" width="24" height="24" fill="#581c87" /><rect x="143" y="203" width="18" height="18" fill="#ffffff" /><rect x="147" y="207" width="10" height="10" fill="#581c87" />
    <rect x="55" y="260" width="24" height="24" fill="#581c87" /><rect x="58" y="263" width="18" height="18" fill="#ffffff" /><rect x="62" y="267" width="10" height="10" fill="#581c87" />
    <text x="110" y="250" font-size="9" font-weight="bold" fill="#86198f" text-anchor="middle">QRIS RESMI</text>

    <rect x="15" y="325" width="190" height="35" rx="6" fill="#86198f" />
    <text x="110" y="347" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Sudah Membayar</text>
  </g>

  <!-- Right Side Features Summary -->
  <g transform="translate(600, 110)">
    <rect x="0" y="0" width="270" height="320" rx="8" fill="#ffffff" stroke="#f0abfc" stroke-width="1" />
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#86198f">Design System Highlights</text>
    
    <g transform="translate(20, 60)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4c1d95">
      <text x="0" y="20">📱 Mobile First Responsive UX</text>
      <text x="0" y="55">⚡ Instant QRIS &amp; Virtual Account</text>
      <text x="0" y="90">🏬 Multi-Merchant Multi-Cart</text>
      <text x="0" y="125">📊 Real-Time Sales Telemetry</text>
      <text x="0" y="160">🎨 Figma Scalable Component Lib</text>
      <text x="0" y="195">♿ WCAG Accessibility AA Rated</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a21caf" text-anchor="middle">
    Berani Digital ID • UMKM Empowerment Platform
  </text>
</svg>
