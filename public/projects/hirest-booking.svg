<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#f8fafc" />
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="40" cy="30" r="14" fill="#00a896" />
  <text x="40" y="35" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>
  <text x="65" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Hirest CMS — Guest Folio &amp; Billing</text>
  <text x="360" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">| Bumi Ubud Hotel Room Reservation System</text>
  <rect x="770" y="15" width="120" height="30" rx="4" fill="#00a896" />
  <text x="830" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ NEW BOOKING</text>

  <!-- Reservation Folio Detail Card -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="560" height="380" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="560" height="45" rx="6" fill="#f1f5f9" />
    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#334155">Guest Reservation Detail • Folio #BU-201902-881</text>
    
    <g transform="translate(20, 65)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">
      <text x="0" y="20">Guest Name : <tspan font-weight="bold" fill="#0f172a">Alexander Hamilton</tspan></text>
      <text x="280" y="20">Room Type : <tspan font-weight="bold" fill="#00a896">Deluxe Pool Villa (Room 102)</tspan></text>

      <text x="0" y="55">Check-in : <tspan font-weight="bold" fill="#0f172a">14 Feb 2019, 14:00</tspan></text>
      <text x="280" y="55">Check-out : <tspan font-weight="bold" fill="#0f172a">17 Feb 2019, 12:00 (3 Nights)</tspan></text>

      <line x1="0" y1="80" x2="520" y2="80" stroke="#e2e8f0" stroke-width="1" />

      <!-- Charges Table -->
      <text x="0" y="105" font-weight="bold" fill="#0f172a">Billing Breakdown</text>
      <text x="0" y="130">Room Rate (3 nights @ IDR 1,250,000)</text><text x="450" y="130" font-weight="bold">IDR 3,750,000</text>
      <text x="0" y="155">Airport Transfer &amp; Welcome Drinks</text><text x="450" y="155" font-weight="bold">IDR 350,000</text>
      <text x="0" y="180">Restaurant &amp; Dining (Table 04)</text><text x="450" y="180" font-weight="bold">IDR 420,000</text>
      <text x="0" y="205">Service Charge &amp; Government Tax (21%)</text><text x="450" y="205" font-weight="bold">IDR 950,000</text>

      <line x1="0" y1="225" x2="520" y2="225" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="0" y="250" font-size="13" font-weight="bold" fill="#0f172a">TOTAL BALANCE DUE</text>
      <text x="430" y="250" font-size="14" font-weight="bold" fill="#00a896">IDR 5,470,000</text>

      <rect x="0" y="265" width="120" height="32" rx="4" fill="#00a896" />
      <text x="60" y="285" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PRINT FOLIO</text>

      <rect x="135" y="265" width="120" height="32" rx="4" fill="#0284c7" />
      <text x="195" y="285" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CHECK OUT</text>
    </g>
  </g>

  <!-- Right Side Quick Room Summary -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="280" height="380" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Room Occupancy Ratio</text>
    
    <g transform="translate(20, 60)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">
      <circle cx="120" cy="70" r="50" fill="none" stroke="#e2e8f0" stroke-width="14" />
      <circle cx="120" cy="70" r="50" fill="none" stroke="#00a896" stroke-width="14" stroke-dasharray="240, 100" transform="rotate(-90 120 70)" />
      <text x="120" y="75" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">76%</text>

      <text x="10" y="170">✓ 42 Rooms Checked In Today</text>
      <text x="10" y="195">✓ 18 Departures Scheduled</text>
      <text x="10" y="220">✓ 8 Housekeeping Clean in Progress</text>
      <text x="10" y="245">✓ 100% Channel Manager Sync</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Developed by Telkom Sigma • Slide 2 of 2
  </text>
</svg>
