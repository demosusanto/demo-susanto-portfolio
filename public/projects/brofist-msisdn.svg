    <text x="25" y="62" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">MSISDN</text>
    <text x="145" y="62" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">MODEM POOL</text>
    <text x="270" y="62" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">USAGE</text>
    <text x="390" y="62" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">QUOTA</text>
    <text x="470" y="62" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">STATUS</text>

    <!-- Rows -->
    <g transform="translate(15, 80)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">
      <text x="10" y="20">+62811-9872-001</text><text x="130" y="20">Cluster Jakarta-01</text>
      <!-- Progress Bar 1 -->
