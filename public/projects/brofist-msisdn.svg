      <rect x="0" y="26" width="210" height="10" rx="5" fill="#38bdf8" />
      <text x="220" y="18" fill="#38bdf8" font-weight="bold">84%</text>

      <text x="0" y="64">Jawa Barat &amp; Jateng</text>
      <rect x="0" y="72" width="250" height="10" rx="5" fill="#334155" />
      <rect x="0" y="72" width="160" height="10" rx="5" fill="#0ea5e9" />
      <text x="220" y="64" fill="#0ea5e9" font-weight="bold">64%</text>

      <text x="0" y="110">Jawa Timur &amp; Bali</text>
      <rect x="0" y="118" width="250" height="10" rx="5" fill="#334155" />
      <rect x="0" y="118" width="140" height="10" rx="5" fill="#0284c7" />
      <text x="220" y="110" fill="#0284c7" font-weight="bold">56%</text>

      <text x="0" y="156">Sumatera &amp; Kalimantan</text>
      <rect x="0" y="164" width="250" height="10" rx="5" fill="#334155" />
      <rect x="0" y="164" width="115" height="10" rx="5" fill="#10b981" />
      <text x="220" y="156" fill="#10b981" font-weight="bold">46%</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Telkomsel BroFIST Telemetry Engine • Slide 2 of 2
  </text>
