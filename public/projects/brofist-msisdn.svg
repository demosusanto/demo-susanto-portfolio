      <rect x="455" y="8" width="55" height="18" rx="9" fill="#065f46" />
      <text x="482" y="21" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">ACTIVE</text>

      <text x="10" y="55">+62812-4451-992</text><text x="130" y="55">Cluster Bandung-04</text>
      <!-- Progress Bar 2 -->
      <rect x="255" y="45" width="90" height="10" rx="5" fill="#334155" />
      <rect x="255" y="45" width="85" height="10" rx="5" fill="#f59e0b" />
      <text x="375" y="55">48 GB / 50 GB</text>
      <rect x="455" y="43" width="55" height="18" rx="9" fill="#78350f" />
      <text x="482" y="56" font-size="9" font-weight="bold" fill="#fbbf24" text-anchor="middle">WARNING</text>

      <text x="10" y="90">+62813-2210-334</text><text x="130" y="90">Cluster Surabaya-02</text>
      <!-- Progress Bar 3 -->
      <rect x="255" y="80" width="90" height="10" rx="5" fill="#334155" />
      <rect x="255" y="80" width="40" height="10" rx="5" fill="#10b981" />
      <text x="375" y="90">20 GB / 50 GB</text>
      <rect x="455" y="78" width="55" height="18" rx="9" fill="#065f46" />
      <text x="482" y="91" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">ACTIVE</text>

      <text x="10" y="125">+62811-6623-881</text><text x="130" y="125">Cluster Medan-03</text>
      <!-- Progress Bar 4 -->
      <rect x="255" y="115" width="90" height="10" rx="5" fill="#334155" />
      <rect x="255" y="115" width="50" height="10" rx="5" fill="#38bdf8" />
      <text x="375" y="125">25 GB / 50 GB</text>
      <rect x="455" y="113" width="55" height="18" rx="9" fill="#065f46" />
      <text x="482" y="126" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">ACTIVE</text>
    </g>
  </g>

  <!-- Right Side Regional Quota Distribution -->
  <g transform="translate(600, 185)">
    <rect x="0" y="0" width="290" height="280" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Regional SIM Card Density</text>
    
    <!-- Distribution bars -->
    <g transform="translate(20, 60)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">
      <text x="0" y="18">Jabodetabek</text>
