<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#0f172a" />
  <!-- Header Bar -->
  <rect x="0" y="0" width="920" height="60" fill="#1e293b" />
  <text x="30" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">BroFIST — MSISDN Telemetry &amp; Quotas</text>
  <text x="380" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">| Real-time Modem Quotas &amp; SIM Card Gateway</text>
  <rect x="780" y="15" width="110" height="30" rx="4" fill="#059669" />
  <text x="835" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ACTIVE GATEWAY</text>

  <!-- Metric KPI Cards -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="200" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">ACTIVE SIM CARDS</text>
    <text x="16" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#38bdf8">42,890</text>

    <rect x="220" y="0" width="200" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="236" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">TOTAL DATA THROUGHPUT</text>
    <text x="236" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#10b981">842 TB/s</text>

    <rect x="440" y="0" width="200" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="456" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">LOW QUOTA ALERTS</text>
    <text x="456" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#f59e0b">18 SIMs</text>

    <rect x="660" y="0" width="200" height="85" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="676" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">FAILED PACKETS</text>
    <text x="676" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#f43f5e">0.001%</text>
  </g>

  <!-- MSISDN Quota Allocation Table -->
  <g transform="translate(30, 185)">
    <rect x="0" y="0" width="550" height="280" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Monitored MSISDN Pool Quota Status</text>

