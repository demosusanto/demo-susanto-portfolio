<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#f8fafc" />
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="40" cy="30" r="14" fill="#dc2626" />
  <text x="40" y="35" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>
  <text x="65" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">M-Bike Fleet Diagnostics &amp; Battery Telemetry</text>
  <text x="440" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">| Real-time IoT Bike Health</text>

  <!-- Motorcycle Unit Diagnostics -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="560" height="380" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="0" y="0" width="560" height="45" rx="6" fill="#fef2f2" />
    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Vehicle Telemetry Profile • Honda PCX Electric #AHM-0912</text>
    
    <g transform="translate(20, 70)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">
      <text x="0" y="20">Plate Number : <tspan font-weight="bold" fill="#0f172a">B 4123 TKM</tspan></text>
      <text x="280" y="20">Driver Assigned : <tspan font-weight="bold" fill="#0f172a">Ahmad Fauzi (ID #DRV-442)</tspan></text>

      <text x="0" y="55">Battery Pack A : <tspan font-weight="bold" fill="#16a34a">92% (Optimal Health)</tspan></text>
      <text x="280" y="55">Battery Pack B : <tspan font-weight="bold" fill="#16a34a">88% (Optimal Health)</tspan></text>

      <line x1="0" y1="80" x2="520" y2="80" stroke="#e2e8f0" stroke-width="1" />

      <!-- Speed & RPM Telemetry Chart -->
      <text x="0" y="110" font-weight="bold" fill="#0f172a">Speed &amp; Motor RPM Log (Last 2 Hours)</text>
      <path d="M 0,180 Q 70,120 140,160 T 280,110 T 420,140 T 520,100" fill="none" stroke="#dc2626" stroke-width="2.5" />
      <path d="M 0,210 Q 70,180 140,200 T 280,160 T 420,190 T 520,150" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2" />

      <text x="0" y="240" font-size="10" fill="#dc2626">● Motor RPM (x100)</text>
      <text x="140" y="240" font-size="10" fill="#2563eb">● GPS Speed (km/h) - Avg: 42 km/h</text>
      <text x="360" y="240" font-size="10" fill="#16a34a">● Geofence: Inside Zone A</text>
    </g>
  </g>

  <!-- Right Side Quick Actions -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="280" height="380" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Remote Commands</text>
    
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="240" height="42" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
      <text x="120" y="26" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">🚨 REMOTE ENGINE IMMOBILIZE</text>

      <rect x="0" y="55" width="240" height="42" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
      <text x="120" y="81" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">⚡ UNLOCK BATTERY COMPARTMENT</text>

      <rect x="0" y="110" width="240" height="42" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
      <text x="120" y="136" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">📍 PING REAL-TIME GPS COORDINATES</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    PT Astra Honda Motor × IoT Connected Fleet Platform • Slide 2 of 2
  </text>
</svg>
