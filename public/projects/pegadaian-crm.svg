      <text x="452" y="56" font-size="9" font-weight="bold" fill="#854d0e" text-anchor="middle">Waiting</text>

      <text x="10" y="90">#PG-9919</text>
      <text x="60" y="90">Anita Dewi</text>
      <text x="165" y="90">KCA Pembiayaan</text>
      <text x="305" y="90">Mobile App</text>
      <rect x="420" y="78" width="65" height="18" rx="9" fill="#dcfce7" />
      <text x="452" y="91" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">Resolved</text>

      <text x="10" y="125">#PG-9918</text>
      <text x="60" y="125">Ahmad Zaki</text>
      <text x="165" y="125">Rahn Syariah Titipan</text>
      <text x="305" y="125">Live Chat</text>
