    <!-- Donut Chart -->
    <circle cx="150" cy="125" r="55" fill="none" stroke="#eab308" stroke-width="20" />
    <circle cx="150" cy="125" r="55" fill="none" stroke="#15803d" stroke-width="20" stroke-dasharray="180, 160" transform="rotate(-60 150 125)" />
    <circle cx="150" cy="125" r="55" fill="none" stroke="#0284c7" stroke-width="20" stroke-dasharray="80, 260" transform="rotate(130 150 125)" />
    
    <g transform="translate(25, 210)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#334155">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#15803d" /><text x="18" y="9">KCA Konvensional (52%)</text>
      <rect x="150" y="0" width="10" height="10" rx="2" fill="#eab308" /><text x="168" y="9">Mulia &amp; Tabungan Emas (28%)</text>
      <rect x="0" y="20" width="10" height="10" rx="2" fill="#0284c7" /><text x="18" y="29">Rahn Syariah (20%)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#166534" text-anchor="middle">
