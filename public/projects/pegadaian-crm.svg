    <text x="236" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#166534">RESOLVED TICKETS</text>
    <text x="236" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#047857">98.6%</text>

    <rect x="440" y="0" width="200" height="85" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
    <text x="456" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#166534">GOLD TRANSACTIONS</text>
    <text x="456" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#b45309">Rp 4.8B</text>

    <rect x="660" y="0" width="200" height="85" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
    <text x="676" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#166534">CSAT RATING</text>
    <text x="676" y="62" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="bold" fill="#eab308">★ 4.92</text>
