<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#0f172a" />
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#1e293b" />
  <rect x="25" y="16" width="55" height="28" rx="4" fill="#f15a24" />
  <text x="52" y="35" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">BNI</text>
  <text x="95" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">DMA — Teradata to Oracle SQL Migration</text>
  <text x="470" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">| Enterprise Banking Data Management &amp; Analytics</text>

  <!-- Query Workbench View -->
  <g transform="translate(30, 80)">
    <!-- Source Teradata Query Box -->
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="410" height="35" rx="8" fill="#0f172a" />
    <circle cx="20" cy="18" r="5" fill="#f43f5e" /><circle cx="35" cy="18" r="5" fill="#fbbf24" /><circle cx="50" cy="18" r="5" fill="#10b981" />
    <text x="70" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">SOURCE: Teradata SQL Script (dwh_fact_tx)</text>

    <g transform="translate(15, 55)" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">
      <text x="0" y="20"><tspan fill="#38bdf8">SEL</tspan> a.cif_no, a.acct_num,</text>
      <text x="0" y="40">    <tspan fill="#f59e0b">SUM</tspan>(a.tx_amt) <tspan fill="#38bdf8">AS</tspan> tot_balance,</text>
      <text x="0" y="60">    <tspan fill="#f43f5e">CSUM</tspan>(a.tx_amt, a.tx_dt) <tspan fill="#38bdf8">AS</tspan> run_bal,</text>
      <text x="0" y="80">    <tspan fill="#f43f5e">QUALIFY</tspan> <tspan fill="#f59e0b">ROW_NUMBER</tspan>()</text>
      <text x="0" y="100">    <tspan fill="#38bdf8">OVER</tspan>(<tspan fill="#38bdf8">PARTITION BY</tspan> a.cif_no</text>
      <text x="0" y="120">         <tspan fill="#38bdf8">ORDER BY</tspan> a.tx_dt <tspan fill="#38bdf8">DESC</tspan>) = 1</text>
      <text x="0" y="140"><tspan fill="#38bdf8">FROM</tspan> bni_dw.f_tx_cif a</text>
      <text x="0" y="160"><tspan fill="#38bdf8">WHERE</tspan> a.tx_dt <tspan fill="#38bdf8">BETWEEN</tspan> DATE'2025-01-01'</text>
      <text x="0" y="180">  <tspan fill="#38bdf8">AND</tspan> DATE'2025-12-31';</text>
      <text x="0" y="220" fill="#64748b">-- Execution Latency: 142.6s</text>
    </g>
  </g>

  <!-- Arrow Transition -->
  <g transform="translate(445, 250)">
    <circle cx="15" cy="15" r="22" fill="#0284c7" />
    <path d="M 8,15 L 22,15 M 16,9 L 22,15 L 16,21" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Target Oracle SQL Query Box -->
  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="410" height="380" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="35" rx="8" fill="#0369a1" />
    <circle cx="20" cy="18" r="5" fill="#f43f5e" /><circle cx="35" cy="18" r="5" fill="#fbbf24" /><circle cx="50" cy="18" r="5" fill="#10b981" />
    <text x="70" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TARGET: Optimized Oracle 19c SQL (SIT Validated)</text>

    <g transform="translate(15, 55)" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1">
      <text x="0" y="20"><tspan fill="#38bdf8">WITH</tspan> ranked_tx <tspan fill="#38bdf8">AS</tspan> (</text>
      <text x="0" y="40">  <tspan fill="#38bdf8">SELECT</tspan> /*+ INDEX(a idx_f_tx_cif) */</text>
      <text x="0" y="60">    a.cif_no, a.acct_num,</text>
      <text x="0" y="80">    <tspan fill="#f59e0b">SUM</tspan>(a.tx_amt) <tspan fill="#38bdf8">OVER</tspan>(<tspan fill="#38bdf8">PARTITION BY</tspan> a.cif_no),</text>
      <text x="0" y="100">    <tspan fill="#f59e0b">ROW_NUMBER</tspan>() <tspan fill="#38bdf8">OVER</tspan>(<tspan fill="#38bdf8">PARTITION BY</tspan> a.cif_no</text>
      <text x="0" y="120">               <tspan fill="#38bdf8">ORDER BY</tspan> a.tx_dt <tspan fill="#38bdf8">DESC</tspan>) <tspan fill="#38bdf8">AS</tspan> rn</text>
      <text x="0" y="140">  <tspan fill="#38bdf8">FROM</tspan> bni_dw.f_tx_cif a</text>
      <text x="0" y="160">  <tspan fill="#38bdf8">WHERE</tspan> a.tx_dt &gt;= TO_DATE('2025-01-01')</text>
      <text x="0" y="180">)</text>
      <text x="0" y="200"><tspan fill="#38bdf8">SELECT</tspan> * <tspan fill="#38bdf8">FROM</tspan> ranked_tx <tspan fill="#38bdf8">WHERE</tspan> rn = 1;</text>
      <text x="0" y="240" fill="#10b981" font-weight="bold">✓ Execution Latency: 12.4s (11.5x Speedup!)</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    PT Bank Negara Indonesia (Persero) Tbk. • Data Management &amp; Analytics (DMA) Division
  </text>
</svg>
