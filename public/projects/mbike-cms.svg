<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#f1f5f9" />
  
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="40" cy="30" r="14" fill="#dc2626" />
  <text x="40" y="35" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>
  <text x="65" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">M-Bike CMS Admin</text>
  <text x="220" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">| PT Astra Honda Motor IoT Fleet Dashboard</text>
  
  <rect x="760" y="15" width="130" height="30" rx="4" fill="#dc2626" />
  <text x="825" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE FLEET MAP</text>

  <!-- Left Side: Map Simulation -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="560" height="390" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Simulated Map Roads -->
    <path d="M 0,100 Q 150,140 280,80 T 560,150" fill="none" stroke="#ffffff" stroke-width="10" />
    <path d="M 200,0 Q 240,150 180,300 T 260,390" fill="none" stroke="#ffffff" stroke-width="12" />
    <path d="M 380,0 Q 420,180 370,300 T 450,390" fill="none" stroke="#ffffff" stroke-width="8" />
    <path d="M 0,280 Q 200,240 400,320 T 560,260" fill="none" stroke="#ffffff" stroke-width="10" />

    <!-- Geofence Zone Circle -->
    <circle cx="280" cy="190" r="90" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" />
    <text x="280" y="115" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">GEOFENCE ZONE A</text>

    <!-- Bike GPS Pin Markers -->
    <g transform="translate(230, 150)">
      <circle cx="0" cy="0" r="12" fill="#16a34a" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="16" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#0f172a">B 4123 TKM (Moving)</text>
    </g>

    <g transform="translate(310, 220)">
      <circle cx="0" cy="0" r="12" fill="#16a34a" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="16" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#0f172a">B 8890 AHM (Moving)</text>
    </g>

    <g transform="translate(180, 260)">
      <circle cx="0" cy="0" r="12" fill="#ca8a04" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="16" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#0f172a">B 6541 PRF (Idle)</text>
    </g>

    <g transform="translate(420, 140)">
      <circle cx="0" cy="0" r="12" fill="#dc2626" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="16" y="4" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#dc2626">B 1092 SPD (Speed Alert!)</text>
    </g>
  </g>

  <!-- Right Side Stats Panel -->
  <g transform="translate(610, 80)">
    <!-- Active Bikes Card -->
    <rect x="0" y="0" width="280" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#64748b">ACTIVE HONDA FLEET</text>
    <text x="20" y="65" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#16a34a">3,248 <tspan font-size="14" font-weight="normal" fill="#64748b">/ 3,500</tspan></text>

    <!-- Speed Alerts Card -->
    <rect x="0" y="100" width="280" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="130" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#64748b">SPEED &amp; GEOFENCE ALERTS</text>
    <text x="20" y="165" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#dc2626">12 <tspan font-size="14" font-weight="normal" fill="#64748b">Active</tspan></text>

    <!-- Daily Mileage Utilization -->
    <rect x="0" y="200" width="280" height="190" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="230" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Daily Fleet Utilization</text>
    
    <!-- Bar charts -->
    <g transform="translate(20, 250)">
      <rect x="0" y="30" width="24" height="80" rx="3" fill="#cbd5e1" />
      <text x="12" y="125" font-size="9" fill="#64748b" text-anchor="middle">Mon</text>

      <rect x="35" y="15" width="24" height="95" rx="3" fill="#cbd5e1" />
      <text x="47" y="125" font-size="9" fill="#64748b" text-anchor="middle">Tue</text>

      <rect x="70" y="20" width="24" height="90" rx="3" fill="#cbd5e1" />
      <text x="82" y="125" font-size="9" fill="#64748b" text-anchor="middle">Wed</text>

      <rect x="105" y="8" width="24" height="102" rx="3" fill="#cbd5e1" />
      <text x="117" y="125" font-size="9" fill="#64748b" text-anchor="middle">Thu</text>

      <rect x="140" y="0" width="24" height="110" rx="3" fill="#dc2626" />
      <text x="152" y="125" font-size="9" fill="#dc2626" font-weight="bold" text-anchor="middle">Today</text>

      <rect x="175" y="40" width="24" height="70" rx="3" fill="#cbd5e1" />
      <text x="187" y="125" font-size="9" fill="#64748b" text-anchor="middle">Sat</text>

      <rect x="210" y="60" width="24" height="50" rx="3" fill="#cbd5e1" />
      <text x="222" y="125" font-size="9" fill="#64748b" text-anchor="middle">Sun</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    PT Astra Honda Motor × PT Telekomunikasi Selular Fleet Management System
  </text>
</svg>
