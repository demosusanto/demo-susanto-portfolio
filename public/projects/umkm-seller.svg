<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#fdf4ff" />
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#86198f" />
  <circle cx="40" cy="30" r="14" fill="#f472b6" />
  <text x="40" y="35" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">U</text>
  <text x="65" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">UMKM Merchant Center &amp; Inventory Management</text>
  <text x="470" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f5d0fe">| Dashboard Mitra Penjual</text>

  <!-- Sales Analytics Card -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="560" height="380" rx="8" fill="#ffffff" stroke="#f0abfc" stroke-width="1" />
    <rect x="0" y="0" width="560" height="45" rx="8" fill="#fae8ff" />
    <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#701a75">Toko Berkah Snack Depok • Status: BUKA</text>
    
    <g transform="translate(20, 65)">
      <!-- Sales Stats -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="75" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1" />
        <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#a21caf">OMSET BULAN INI</text>
        <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#701a75">Rp 18.420.000</text>

        <rect x="180" y="0" width="160" height="75" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1" />
        <text x="196" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#a21caf">PESANAN BARU</text>
        <text x="196" y="52" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#701a75">34 Pesanan</text>

        <rect x="360" y="0" width="160" height="75" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1" />
        <text x="376" y="24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#a21caf">RATING TOKO</text>
        <text x="376" y="52" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#eab308">★ 4.95</text>
      </g>

      <!-- Inventory Table -->
      <g transform="translate(0, 100)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#701a75">Stok &amp; Varian Produk</text>
        <rect x="0" y="10" width="520" height="24" fill="#fae8ff" rx="3" />
        <text x="10" y="26" font-size="10" font-weight="bold" fill="#86198f">NAMA PRODUK</text>
        <text x="220" y="26" font-size="10" font-weight="bold" fill="#86198f">KATEGORI</text>
        <text x="340" y="26" font-size="10" font-weight="bold" fill="#86198f">HARGA</text>
        <text x="440" y="26" font-size="10" font-weight="bold" fill="#86198f">STOK</text>

        <g transform="translate(0, 45)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#4c1d95">
          <text x="10" y="10">Keripik Tempe Renyah 250g</text><text x="220" y="10">Makanan Ringan</text><text x="340" y="10">Rp 15.000</text><text x="440" y="10" font-weight="bold" fill="#16a34a">142 pcs</text>
          <text x="10" y="40">Kopi Robusta Asli 500g</text><text x="220" y="40">Minuman Herbal</text><text x="340" y="40">Rp 45.000</text><text x="440" y="40" font-weight="bold" fill="#16a34a">88 pcs</text>
          <text x="10" y="70">Sambal Cumi Juara 150g</text><text x="220" y="70">Bumbu &amp; Sambal</text><text x="340" y="70">Rp 28.000</text><text x="440" y="70" font-weight="bold" fill="#dc2626">8 pcs (Menipis)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Side Quick Dispatch -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="280" height="380" rx="8" fill="#ffffff" stroke="#f0abfc" stroke-width="1" />
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#86198f">Pengiriman Ekspedisi</text>
    
    <g transform="translate(20, 60)" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4c1d95">
      <rect x="0" y="0" width="240" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
      <text x="15" y="26">Siap Dikirim: <tspan font-weight="bold" fill="#86198f">12 Paket</tspan></text>

      <rect x="0" y="55" width="240" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
      <text x="15" y="81">Dalam Perjalanan: <tspan font-weight="bold" fill="#86198f">18 Paket</tspan></text>

      <rect x="0" y="110" width="240" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
      <text x="15" y="136">Selesai Diterima: <tspan font-weight="bold" fill="#16a34a">145 Paket</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a21caf" text-anchor="middle">
    Berani Digital ID • Slide 2 of 2
  </text>
</svg>
