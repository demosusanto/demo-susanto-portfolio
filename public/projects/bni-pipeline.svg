<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="#0f172a" />
  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#1e293b" />
  <rect x="25" y="16" width="55" height="28" rx="4" fill="#f15a24" />
  <text x="52" y="35" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">BNI</text>
  <text x="95" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">Enterprise Data Pipeline &amp; SIT Verification</text>
  <text x="440" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">| DMA Division Stored Procedure Flow</text>

  <!-- Pipeline Stages Diagram -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="860" height="380" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">End-to-End Core Banking Data Pipeline Execution Status</text>

    <!-- Stage 1: Extraction -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#0284c7" />
      <text x="85" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1. EXTRACTION</text>

      <g transform="translate(15, 45)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
        <text x="0" y="20">Source: Teradata EDW</text>
        <text x="0" y="45">Rows: 12.8M Records</text>
        <text x="0" y="70">Batch Window: 01:00 AM</text>
        <text x="0" y="95" fill="#34d399" font-weight="bold">✓ 100% Extracted</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <path d="M 205,160 L 245,160 M 235,153 L 245,160 L 235,167" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Stage 2: Conversion & Transformation -->
    <g transform="translate(255, 70)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#0369a1" />
      <text x="85" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2. QUERY CONVERT</text>

      <g transform="translate(15, 45)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
        <text x="0" y="20">Syntax: Oracle PL/SQL</text>
        <text x="0" y="45">Procedures: 84 SPs</text>
        <text x="0" y="70">Index Tuning: Applied</text>
        <text x="0" y="95" fill="#34d399" font-weight="bold">✓ 0 Syntax Errors</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <path d="M 435,160 L 475,160 M 465,153 L 475,160 L 465,167" fill="none" stroke="#0ea5e9" stroke-width="2.5" />

    <!-- Stage 3: Data Migration & Load -->
    <g transform="translate(485, 70)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#0f172a" stroke="#f15a24" stroke-width="1.5" />
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#f15a24" />
      <text x="85" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3. ORACLE LOAD</text>

      <g transform="translate(15, 45)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
        <text x="0" y="20">Target: Oracle 19c DMA</text>
        <text x="0" y="45">Partition: Daily Range</text>
        <text x="0" y="70">Load Time: 12.4 min</text>
        <text x="0" y="95" fill="#34d399" font-weight="bold">✓ Data Committed</text>
      </g>
    </g>

    <!-- Arrow 3 -->
    <path d="M 665,160 L 705,160 M 695,153 L 705,160 L 695,167" fill="none" stroke="#f15a24" stroke-width="2.5" />

    <!-- Stage 4: SIT Validation & Reconcile -->
    <g transform="translate(715, 70)">
      <rect x="0" y="0" width="125" height="180" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="125" height="32" rx="6" fill="#059669" />
      <text x="62" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4. SIT CHECK</text>

      <g transform="translate(12, 45)" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">
        <text x="0" y="20">Checksum: Match</text>
        <text x="0" y="45">Variance: 0.00%</text>
        <text x="0" y="70">Sign-off: Passed</text>
        <text x="0" y="95" fill="#34d399" font-weight="bold">✓ 100% Passed</text>
      </g>
    </g>

    <!-- SIT Benchmark Footer Card -->
    <g transform="translate(25, 275)">
      <rect x="0" y="0" width="815" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">System Integration Testing (SIT) Benchmark &amp; Documentation Summary</text>
      <text x="20" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">DBeaver &amp; Oracle SQL Developer Automated SIT Test Runs: 142/142 Test Cases Verified with Zero Discrepancy.</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="460" y="505" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    PT Bank Negara Indonesia (Persero) Tbk. • DMA Enterprise Pipeline • Slide 2 of 2
  </text>
</svg>
