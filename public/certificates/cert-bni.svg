<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="100%" height="100%">
  <defs>
    <filter id="shadow-bni" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="900" height="630" fill="#f4fbfb" />

  <rect x="25" y="25" width="850" height="580" fill="#ffffff" stroke="#005e54" stroke-width="4" rx="2" />
  <rect x="35" y="35" width="830" height="560" fill="#ffffff" stroke="#f15a24" stroke-width="1.5" />
  <rect x="42" y="42" width="816" height="546" fill="none" stroke="#e0f2f1" stroke-width="1" />

  <!-- Side Ribbons (BNI Teal & Orange) -->
  <g fill="#005e54">
    <polygon points="50,42 90,42 90,260 70,240 50,260" filter="url(#shadow-bni)" />
    <polygon points="50,588 90,588 90,370 70,390 50,370" filter="url(#shadow-bni)" />
    <polygon points="850,42 810,42 810,260 830,240 850,260" filter="url(#shadow-bni)" />
    <polygon points="850,588 810,588 810,370 830,390 850,370" filter="url(#shadow-bni)" />
  </g>

  <!-- BNI DMA Logo / Heading -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <rect x="-35" y="-18" width="70" height="34" rx="6" fill="#f15a24" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1">
      BNI
    </text>
    <text x="0" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#005e54" letter-spacing="1">
      DATA MANAGEMENT &amp; ANALYTICS (DMA)
    </text>
    <text x="0" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#607d8b">
      PT BANK NEGARA INDONESIA (PERSERO) TBK.
    </text>
  </g>

  <g text-anchor="middle">
    <text x="450" y="190" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="bold" fill="#005e54" letter-spacing="1.5">
      CERTIFICATE OF ACHIEVEMENT
    </text>
    <text x="450" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#607d8b">
      This is to certify that:
    </text>

    <!-- Name -->
    <text x="450" y="265" font-family="'Times New Roman', Georgia, serif" font-size="30" font-weight="bold" fill="#005e54">
      Demo Susanto
    </text>

    <!-- Role -->
    <text x="450" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f15a24">
      Data Engineer Consultant (via PT Indocyber Global Teknologi)
    </text>

    <text x="450" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#37474f">
      Successfully completed enterprise Teradata to Oracle SQL query conversion, stored procedure validation,
    </text>
    <text x="450" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#005e54">
      System Integration Testing (SIT) and High-Volume Banking Data Pipelines
    </text>
    <text x="450" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#37474f">
      with high precision, query performance optimization, and operational excellence.
    </text>

    <text x="450" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#78909c">
      Jakarta, February 2026
    </text>
  </g>

  <g transform="translate(0, 440)">
    <g transform="translate(240, 0)" text-anchor="middle">
      <path d="M -50,25 Q -20,-5 0,30 T 30,10 Q 60,35 75,20" fill="none" stroke="#005e54" stroke-width="2" />
      <line x1="-80" y1="50" x2="80" y2="50" stroke="#b0bec5" stroke-width="1" />
      <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#005e54">
        Division Head DMA
      </text>
      <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78909c">
        PT Bank Negara Indonesia
      </text>
    </g>

    <g transform="translate(450, 30)" text-anchor="middle">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#005e54" stroke-width="2" opacity="0.85" stroke-dasharray="4,2" />
      <text x="0" y="-3" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#005e54">BNI DMA</text>
      <text x="0" y="10" font-family="'Arial Black', sans-serif" font-size="11" font-weight="bold" fill="#005e54">VERIFIED</text>
    </g>

    <g transform="translate(660, 0)" text-anchor="middle">
      <path d="M -45,30 Q -15,-10 10,25 T 45,5 Q 65,30 85,15" fill="none" stroke="#005e54" stroke-width="2" />
      <line x1="-80" y1="50" x2="80" y2="50" stroke="#b0bec5" stroke-width="1" />
      <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#005e54">
        Senior Project Manager
      </text>
      <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#78909c">
        PT Indocyber Global Teknologi
      </text>
    </g>
  </g>
</svg>
