<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" />
      <stop offset="50%" stop-color="#e6ca65" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="900" height="630" fill="#f5f1e8" />
  
  <!-- Outer Decorative Border Frame -->
  <rect x="25" y="25" width="850" height="580" fill="#ffffff" stroke="#8b7355" stroke-width="4" rx="2" />
  <rect x="35" y="35" width="830" height="560" fill="#fdfbf7" stroke="#d4af37" stroke-width="1.5" />
  <rect x="42" y="42" width="816" height="546" fill="none" stroke="#e8d8b5" stroke-width="0.8" />

  <!-- Corner Ornaments -->
  <g stroke="#8b7355" stroke-width="1.5" fill="none">
    <path d="M 45 65 L 65 65 L 65 45" />
    <circle cx="65" cy="65" r="3" fill="#8b7355" />
    <path d="M 855 65 L 835 65 L 835 45" />
    <circle cx="835" cy="65" r="3" fill="#8b7355" />
    <path d="M 45 565 L 65 565 L 65 585" />
    <circle cx="65" cy="565" r="3" fill="#8b7355" />
    <path d="M 855 565 L 835 565 L 835 585" />
    <circle cx="835" cy="565" r="3" fill="#8b7355" />
  </g>

  <!-- Red Decorative Side Ribbons (matches screenshot 4) -->
  <g fill="#c93838">
    <!-- Left Ribbon Top & Bottom -->
    <polygon points="50,42 90,42 90,260 70,240 50,260" filter="url(#subtle-shadow)" />
    <polygon points="50,588 90,588 90,370 70,390 50,370" filter="url(#subtle-shadow)" />
    <!-- Right Ribbon Top & Bottom -->
    <polygon points="850,42 810,42 810,260 830,240 850,260" filter="url(#subtle-shadow)" />
    <polygon points="850,588 810,588 810,370 830,390 850,370" filter="url(#subtle-shadow)" />
  </g>

  <!-- Left Edge Vertical Serial Number -->
  <text x="38" y="440" font-family="'Courier New', monospace" font-size="11" fill="#7a7062" transform="rotate(-90 38 440)" letter-spacing="1">
    003/PST-MAG.1/SMK-IU/IV/2017
  </text>

  <!-- Top Center Logo: KOMIT Badge -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Green outer ring & leaf ornament -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#2e7d32" stroke-width="7" />
    <circle cx="0" cy="0" r="17" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#c93838" />
    <!-- KOMIT Text -->
    <text x="0" y="42" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#2e7d32" letter-spacing="2">
      KOMIT
    </text>
  </g>

  <!-- Certificate Heading -->
  <g text-anchor="middle">
    <text x="450" y="185" font-family="'Times New Roman', Georgia, serif" font-size="34" font-weight="bold" fill="#2b261f" letter-spacing="1.5">
      Sertifikat Magang
    </text>
    
    <text x="450" y="215" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14.5" fill="#5c5346">
      diberikan Komunitas Masyarakat Informatika kepada:
    </text>

    <!-- Recipient Name -->
    <text x="450" y="260" font-family="'Times New Roman', Georgia, serif" font-size="30" font-weight="bold" fill="#1f1b16">
      Demo Susanto
    </text>

    <!-- Student / Registration Number -->
    <text x="450" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#4d4437">
      1516.10.038
    </text>

    <!-- School Institution -->
    <text x="450" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#3b3328">
      Sekolah Menengah Kejuruan (SMK) Informatika Utama
    </text>

    <!-- Citation / Reason -->
    <text x="450" y="342" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4a4235">
      Telah menyelesaikan magang dengan <tspan font-weight="bold" fill="#1f1b16">sangat baik</tspan>, membangun aplikasi
    </text>
    <text x="450" y="364" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#1f1b16">
      Telkomsel Integrated Compliance Management System
    </text>
    <text x="450" y="386" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#4a4235">
      menggunakan PHP dan MySQL
    </text>

    <!-- Date of Issue -->
    <text x="450" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#524a3e">
      1 April 2017
    </text>
  </g>

  <!-- Signature Section -->
  <g transform="translate(0, 440)">
    <!-- Left Signatory: Ketua -->
    <g transform="translate(240, 0)" text-anchor="middle">
      <!-- Simulated signature stroke -->
      <path d="M -60,25 Q -30,-5 -10,35 T 20,10 Q 50,40 70,20" fill="none" stroke="#1d2d50" stroke-width="2" />
      <line x1="-80" y1="50" x2="80" y2="50" stroke="#70624d" stroke-width="1" />
      <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#2b261f">
        Bernard EP. Siahaan, SKom., MKom., CISA, MPM
      </text>
      <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#756752" letter-spacing="1">
        KETUA
      </text>
    </g>

    <!-- Center Official Stamp Seal -->
    <g transform="translate(450, 30)" text-anchor="middle">
      <ellipse cx="0" cy="0" rx="36" ry="24" fill="none" stroke="#d32f2f" stroke-width="2" opacity="0.85" stroke-dasharray="4,2" />
      <text x="0" y="-5" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#d32f2f" opacity="0.85">
        KOMUNITAS
      </text>
      <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#d32f2f" opacity="0.85">
        KoMIT
      </text>
      <text x="0" y="17" font-family="'Arial', sans-serif" font-size="8" fill="#d32f2f" opacity="0.85">
        ★ RESMI ★
      </text>
    </g>

    <!-- Right Signatory: Pembimbing -->
    <g transform="translate(660, 0)" text-anchor="middle">
      <!-- Simulated signature stroke -->
      <path d="M -50,30 Q -25,-10 0,25 T 35,5 Q 60,30 80,15" fill="none" stroke="#1d2d50" stroke-width="2" />
      <line x1="-80" y1="50" x2="80" y2="50" stroke="#70624d" stroke-width="1" />
      <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#2b261f">
        Wawan Setiawan, ST., MM., MSL
      </text>
      <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#756752" letter-spacing="1">
        PEMBIMBING
      </text>
    </g>
  </g>
</svg>
