<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="100%" height="100%">
  <defs>
    <filter id="shadow-telkom" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="630" fill="#f8f9fa" />

  <!-- Outer Border -->
  <rect x="25" y="25" width="850" height="580" fill="#ffffff" stroke="#c0392b" stroke-width="4" rx="2" />
  <rect x="35" y="35" width="830" height="560" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5" />
  <rect x="42" y="42" width="816" height="546" fill="none" stroke="#e0e0e0" stroke-width="1" />

  <!-- Side Ribbons (Telkom Red & Navy) -->
  <g fill="#c0392b">
    <polygon points="50,42 90,42 90,260 70,240 50,260" filter="url(#shadow-telkom)" />
    <polygon points="50,588 90,588 90,370 70,390 50,370" filter="url(#shadow-telkom)" />
    <polygon points="850,42 810,42 810,260 830,240 850,260" filter="url(#shadow-telkom)" />
    <polygon points="850,588 810,588 810,370 830,390 850,370" filter="url(#shadow-telkom)" />
  </g>

  <!-- Telkomsigma Logo / Heading -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <!-- Red circle logo -->
    <circle cx="0" cy="0" r="26" fill="#c0392b" />
    <polygon points="-8,-12 12,0 -8,12" fill="#ffffff" />
    <text x="0" y="42" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" letter-spacing="2">
      TELKOMSIGMA
    </text>
    <text x="0" y="56" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#7f8c8d" letter-spacing="1">
      PT SIGMA CIPTA CARAKA (TELKOM GROUP)
    </text>
  </g>

  <g text-anchor="middle">
    <text x="450" y="190" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="bold" fill="#2c3e50" letter-spacing="1.5">
      CERTIFICATE OF APPRECIATION
    </text>
    <text x="450" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#7f8c8d">
      This certificate is proudly awarded to:
    </text>

    <!-- Name -->
    <text x="450" y="265" font-family="'Times New Roman', Georgia, serif" font-size="30" font-weight="bold" fill="#c0392b">
      Demo Susanto
    </text>

    <!-- Role -->
    <text x="450" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34495e">
      Frontend Developer — Enterprise Digital Solutions
    </text>

    <!-- Citation -->
    <text x="450" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#555555">
      In recognition of outstanding dedication, technical expertise, and valuable contributions to the development of
    </text>
    <text x="450" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">
      Hirest CMS, BroFIST &amp; NSAM Tools, and Pegadaian CRM Portal
    </text>
    <text x="450" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#555555">
      supporting mission-critical enterprise client services under PT Telekomunikasi Selular.
    </text>

    <text x="450" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" fill="#7f8c8d">
      Jakarta, July 2023
    </text>
  </g>

  <!-- Signatures -->
  <g transform="translate(0, 440)">
    <g transform="translate(240, 0)" text-anchor="middle">
      <path d="M -50,25 Q -20,-5 0,30 T 30,10 Q 60,35 75,20" fill="none" stroke="#2c3e50" stroke-width="2" />
      <line x1="-80" y1="50" x2="80" y2="50" stroke="#bdc3c7" stroke-width="1" />
      <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
        VP of Application Engineering
      </text>
      <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f8c8d">
        PT Sigma Cipta Caraka
      </text>
    </g>

    <!-- Seal -->
    <g transform="translate(450, 30)" text-anchor="middle">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.85" stroke-dasharray="4,2" />
      <text x="0" y="-3" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#c0392b">TELKOMSIGMA</text>
      <text x="0" y="10" font-family="'Arial Black', sans-serif" font-size="11" font-weight="bold" fill="#c0392b">VERIFIED</text>
    </g>

    <g transform="translate(660, 0)" text-anchor="middle">
      <path d="M -45,30 Q -15,-10 10,25 T 45,5 Q 65,30 85,15" fill="none" stroke="#2c3e50" stroke-width="2" />
      <line x1="-80" y1="50" x2="80" y2="50" stroke="#bdc3c7" stroke-width="1" />
      <text x="0" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
        Head of Human Capital
      </text>
      <text x="0" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7f8c8d">
        Enterprise Solutions Div.
      </text>
    </g>
  </g>
</svg>
